name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint (black, isort, flake8, mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Black
        run: black --check app tests

      - name: Run isort
        run: isort --check-only app tests

      - name: Run Flake8
        run: flake8 app tests

      - name: Run mypy
        run: mypy app --ignore-missing-imports
        continue-on-error: true

  test:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mf_trend_analysis_user
          POSTGRES_PASSWORD: G0F5pmwQnvGxndu42hfu3i33AYQTJS2X
          POSTGRES_DB: mf_trend_analysis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mf_user -d mf_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mf_trend_analysis_user:G0F5pmwQnvGxndu42hfu3i33AYQTJS2X@dpg-da29da95efls73ep9k60-a/mf_trend_analysis
      TEST_DATABASE_URL: postgresql://mf_trend_analysis_user:G0F5pmwQnvGxndu42hfu3i33AYQTJS2X@dpg-da29da95efls73ep9k60-a/mf_trend_analysis

      SECRET_KEY: C4znLUCu6624HtJ1bedf3ZLkjJlL8g_tp6xt36r4TnW3OENo3ZAggtKsFmH8JybGzVh8U5WHWpHxFk2lhWx4Wg
      APP_ENV: test
      DEBUG: "false"
      API_V1_PREFIX: /api/v1

      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

      BACKEND_CORS_ORIGINS: '["https://mf-trend-analysis.vercel.app"]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run test suite with coverage
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t mf-intelligence-platform-backend:${{ github.sha }} \
            ./backend

      - name: Create Docker network
        run: docker network create mf-ci-net

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --network mf-ci-net \
            --name test-db \
            -e POSTGRES_USER=mf_user \
            -e POSTGRES_PASSWORD=mf_password \
            -e POSTGRES_DB=mf_platform \
            postgres:16-alpine

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker exec test-db pg_isready \
              -U mf_user \
              -d mf_platform; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL failed to become ready"
          docker logs test-db
          exit 1

      - name: Start backend container
        run: |
          docker run -d \
            --network mf-ci-net \
            --name test-api \
            -e DATABASE_URL=postgresql+psycopg2://mf_user:mf_password@test-db:5432/mf_platform \
            -e APP_ENV=test \
            -e DEBUG=false \
            -e SECRET_KEY=ci-smoke-secret \
            -e API_V1_PREFIX=/api/v1 \
            -e BACKEND_CORS_ORIGINS='["http://localhost:5173"]' \
            -p 8000:8000 \
            mf-intelligence-platform-backend:${{ github.sha }}

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if docker exec test-api \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"; then
              echo "Backend is healthy"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend failed health check"
          docker logs test-api
          exit 1

      - name: Cleanup
        if: always()
        run: |
          docker rm -f test-api test-db || true
          docker network rm mf-ci-net || true
