name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint (black, isort, flake8, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run black (check only)
        run: black --check app tests

      - name: Run isort (check only)
        run: isort --check-only app tests

      - name: Run flake8
        run: flake8 app tests

      - name: Run mypy
        run: mypy app --ignore-missing-imports
        continue-on-error: true # non-blocking during early development; tighten once stable

  test:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mf_user
          POSTGRES_PASSWORD: mf_password
          POSTGRES_DB: mf_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mf_user -d mf_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://mf_user:mf_password@localhost:5432/mf_platform_test
      TEST_DATABASE_URL: postgresql+psycopg2://mf_user:mf_password@localhost:5432/mf_platform_test
      SECRET_KEY: ci-test-secret-key
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run test suite with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: backend
        run: docker build -t mf-intelligence-platform-backend:${{ github.sha }} .

      - name: Verify image runs and responds to health check
        run: |
          docker network create mf-ci-net
          docker run -d --network mf-ci-net --name test-db \
            -e POSTGRES_USER=mf_user -e POSTGRES_PASSWORD=mf_password -e POSTGRES_DB=mf_platform \
            postgres:16-alpine
          sleep 8
          docker run -d --network mf-ci-net --name test-api \
            -e DATABASE_URL=postgresql+psycopg2://mf_user:mf_password@test-db:5432/mf_platform \
            -e APP_ENV=development \
            -e SECRET_KEY=ci-smoke-secret \
            -p 8000:8000 \
            mf-intelligence-platform-backend:${{ github.sha }}
          sleep 8
          docker exec test-api curl -f http://localhost:8000/api/v1/health || (docker logs test-api && exit 1)
