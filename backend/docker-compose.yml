version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: mf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mf_password}
      POSTGRES_DB: ${POSTGRES_DB:-mf_platform}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mf_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mf_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: mf_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  celery_worker:
    build: .
    container_name: mf_celery_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api
      - redis
    volumes:
      - .:/code
    command: celery -A app.tasks.celery_app worker --loglevel=info

  celery_beat:
    build: .
    container_name: mf_celery_beat
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api
      - redis
    volumes:
      - .:/code
    command: celery -A app.tasks.celery_app beat --loglevel=info

volumes:
  pgdata:
