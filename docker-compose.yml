# Full-stack local orchestration: Postgres + Redis + FastAPI + Celery worker/beat + frontend.
#
# This is for local development/demo only. In production the frontend
# deploys to Vercel (see frontend/vercel.json) and the backend deploys to
# Render or Railway (see backend/render.yaml and docs/DEPLOYMENT.md) — Vercel
# does not run arbitrary Docker containers, so this compose file is not the
# production deployment path, just a convenient way to run the whole stack
# locally with one command.
#
# Usage:
#   cp backend/.env.example backend/.env   # fill in SECRET_KEY at minimum
#   docker compose up --build
#   Frontend: http://localhost:5173   API: http://localhost:8000/docs

services:
  db:
    image: postgres:16-alpine
    container_name: mf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mf_password}
      POSTGRES_DB: ${POSTGRES_DB:-mf_platform}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mf_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mf_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: mf_api
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  celery_worker:
    build: ./backend
    container_name: mf_celery_worker
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      - api
      - redis
    volumes:
      - ./backend:/code
    command: celery -A app.tasks.celery_app worker --loglevel=info

  celery_beat:
    build: ./backend
    container_name: mf_celery_beat
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      - api
      - redis
    volumes:
      - ./backend:/code
    command: celery -A app.tasks.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: mf_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
