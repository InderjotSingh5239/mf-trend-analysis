# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New > Blueprint" and select it. This provisions the API, a Celery worker,
# a Celery beat scheduler, managed Postgres, and managed Redis, all wired
# together. Secrets marked `sync: false` must be set manually in the
# Render dashboard after the first deploy (Environment tab).

databases:
  - name: mf-platform-db
    plan: starter
    databaseName: mf_platform
    user: mf_user

services:
  - type: redis
    name: mf-platform-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: mf-platform-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: SECRET_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false # e.g. ["https://your-frontend.vercel.app"]
      - key: FRED_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mf-platform-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: mf-platform-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: mf-platform-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: mf-platform-redis
          type: redis
          property: connectionString

  - type: worker
    name: mf-platform-celery-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    startCommand: celery -A app.tasks.celery_app worker --loglevel=info
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mf-platform-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: mf-platform-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: mf-platform-redis
          type: redis
          property: connectionString

  - type: worker
    name: mf-platform-celery-beat
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    startCommand: celery -A app.tasks.celery_app beat --loglevel=info
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mf-platform-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: mf-platform-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: mf-platform-redis
          type: redis
          property: connectionString
